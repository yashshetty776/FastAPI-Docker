# Two containers: our API + a PostgreSQL database
services:
  db:
    image: postgres:16
    ports:
      - "15432:5432"                         # Windows 15432 -> container's 5432 (for pgAdmin)
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: Poorna@123
      POSTGRES_DB: student_db
    volumes:
      - pgdata:/var/lib/postgresql/data      # keeps the data after a restart
    healthcheck:                               # "is the database ready yet?"
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 2s
      retries: 10

  api:
    build: .
    ports:
      - "8000:8000"                            # your Windows 8000 -> container's 8000
    environment:
      # host is "db" (the service name above), not localhost
      DATABASE_URL: postgresql+psycopg2://postgres:Poorna%40123@db:5432/student_db
    depends_on:
      db:
        condition: service_healthy             # start the API only after the DB is ready

volumes:
  pgdata: